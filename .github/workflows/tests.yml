name: tests

# The migration suite is the gate that stands between an update and someone's
# archive. It runs on every push and every PR, on all three platforms Receipts
# ships to, because path handling is exactly where per-OS bugs hide.

on:
  push:
    branches: ["**"]   # any branch, so work in progress is covered too
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs this as its gate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check the app starts from a clean slate
        shell: bash
        env:
          RECEIPTS_NO_BROWSER: "1"
        run: |
          export RECEIPTS_DATA="${RUNNER_TEMP}/fresh-archive"
          python -c "
          import app, sqlite3
          conn = app.db()
          v = conn.execute('PRAGMA user_version').fetchone()[0]
          assert v == app.SCHEMA_VERSION, f'fresh archive at v{v}, expected v{app.SCHEMA_VERSION}'
          print('fresh archive OK at v%d' % v)
          "

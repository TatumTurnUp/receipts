name: release

# Cutting a release is one command:
#
#     git tag v1.2.0 && git push --tags        → a normal release
#     git tag v1.3.0-beta.1 && git push --tags → a beta, for testers only
#
# This builds Receipts for macOS (Apple Silicon and Intel), Windows and Linux,
# then attaches the installers to a GitHub Release. Beta tags are published as
# prereleases so they stay out of everyone else's way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  # The tests that stand between an update and someone's archive. Nothing gets
  # built until they pass.
  guard:
    uses: ./.github/workflows/tests.yml

  version:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          if [[ "$VERSION" == *-beta* || "$VERSION" == *-rc* ]]; then
            CHANNEL=beta; PRERELEASE=true
          else
            CHANNEL=stable; PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION on the $CHANNEL channel"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-intel
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04        # oldest glibc we support, for portability
            label: linux
    runs-on: ${{ matrix.os }}

    # Job-level so the signing step can test it: a step cannot read its own
    # env block from an `if`, and the secrets context is not available there.
    env:
      HAS_APPLE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pywebview needs the system web view toolkit AND Python bindings the
      # build interpreter can actually import. apt's python3-gi is built for
      # the distro's Python, not the one setup-python installed, so it has to
      # come from pip against these headers — otherwise the bundle silently
      # ships with no window and every Linux user gets a browser tab.
      - name: Install Linux web view libraries
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev \
            gir1.2-webkit2-4.1 libgtk-3-dev pkg-config
          pip install "PyGObject<3.52" pycairo

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Stamp the version into the build
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["VERSION"]; c = os.environ["CHANNEL"]
          p = pathlib.Path("version.py"); s = p.read_text()
          s = re.sub(r'^VERSION = ".*"$', f'VERSION = "{v}"', s, flags=re.M)
          s = re.sub(r'^CHANNEL = ".*?"', f'CHANNEL = "{c}"', s, flags=re.M)
          p.write_text(s)
          print(s.split("VERSION =")[1][:60])
          PY
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}

      - name: Build the macOS icon
        if: startsWith(matrix.os, 'macos')
        run: iconutil -c icns build-assets/Receipts.iconset -o build-assets/icon.icns

      # Fail loudly rather than shipping a degraded build. Without this the
      # only symptom is that the app opens in a browser instead of a window,
      # which nobody notices until a user reports it.
      - name: Verify the native window backend is available
        shell: bash
        run: |
          python - <<'PY'
          import sys
          if sys.platform == "darwin":
              import webview.platforms.cocoa
          elif sys.platform == "win32":
              import webview.platforms.edgechromium
          else:
              import gi
              gi.require_version("Gtk", "3.0")
              gi.require_version("WebKit2", "4.1")
              import webview.platforms.gtk
          print("native window backend OK")
          PY

      - name: Build the app
        run: pyinstaller receipts.spec --noconfirm

      - name: Verify the bundle contains what it needs
        shell: bash
        run: python build-assets/verify_bundle.py

      # ---------------------------------------------------------------- macOS
      - name: Sign and notarize
        if: startsWith(matrix.os, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Certificate into a throwaway keychain that dies with the runner.
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k runner build.keychain
          rm /tmp/cert.p12

          codesign --deep --force --options runtime --timestamp \
            --entitlements build-assets/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "dist/Receipts.app"

          # Notarize the DMG rather than the .app: it is the thing users
          # actually download, so it is the thing Gatekeeper checks.
          hdiutil create -volname "Receipts" -srcfolder "dist/Receipts.app" \
            -ov -format UDZO "dist/Receipts.dmg"
          xcrun notarytool submit "dist/Receipts.dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Receipts.dmg"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Package unsigned DMG
        if: startsWith(matrix.os, 'macos') && env.SIGNED != '1'
        run: |
          hdiutil create -volname "Receipts" -srcfolder "dist/Receipts.app" \
            -ov -format UDZO "dist/Receipts.dmg"
          echo "::warning::Unsigned macOS build — users will need to right-click → Open."

      - name: Name the macOS artifact
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p out
          mv dist/Receipts.dmg "out/Receipts-${{ needs.version.outputs.version }}-${{ matrix.label }}.dmg"

      # -------------------------------------------------------------- Windows
      - name: Build the Windows installer
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Bundled so a machine without the WebView2 runtime gets it during
          # install, rather than opening a blank white window later.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build-assets\MicrosoftEdgeWebview2Setup.exe"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "build-assets\receipts.iss"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item installer\*.exe "out\Receipts-Setup-${{ needs.version.outputs.version }}.exe"

      # ---------------------------------------------------------------- Linux
      - name: Build the AppImage
        if: matrix.label == 'linux'
        run: |
          APPDIR=build/Receipts.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -r dist/Receipts/* "$APPDIR/usr/bin/"
          cp build-assets/icon.png "$APPDIR/receipts.png"
          for size in 16 32 64 128 256 512; do
            src="build-assets/icons/icon_${size}.png"
            [ -f "$src" ] || continue
            mkdir -p "$APPDIR/usr/share/icons/hicolor/${size}x${size}/apps"
            cp "$src" "$APPDIR/usr/share/icons/hicolor/${size}x${size}/apps/receipts.png"
          done

          cat > "$APPDIR/receipts.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Receipts
          Comment=Your private archive
          Exec=Receipts
          Icon=receipts
          Categories=Utility;Office;
          StartupWMClass=receipts
          EOF
          cp "$APPDIR/receipts.desktop" "$APPDIR/usr/share/applications/"

          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/Receipts" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          wget -qO appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "Receipts-${{ needs.version.outputs.version }}-x86_64.AppImage"
          mkdir -p out && mv *.AppImage out/

      - uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.label }}
          path: out/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we are about to publish
        run: ls -lah artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Receipts ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            | Your computer | Download |
            |---|---|
            | Mac (Apple Silicon — M1 and newer) | `Receipts-${{ needs.version.outputs.version }}-macos-arm64.dmg` |
            | Mac (Intel) | `Receipts-${{ needs.version.outputs.version }}-macos-intel.dmg` |
            | Windows | `Receipts-Setup-${{ needs.version.outputs.version }}.exe` |
            | Linux | `Receipts-${{ needs.version.outputs.version }}-x86_64.AppImage` |

            **Your archive is safe.** Installing this replaces only the app.
            Your records, files and settings live in a separate per-user folder
            (shown in Settings) and are never touched by an update. A permanent
            backup is taken before any change to the database format.
